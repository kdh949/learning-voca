      - branches
      - conflicts
      - resolutions
      - schedulerConfigs
      - catalogSnapshots
      - senseRevisions
      - deckRevisions
      - deviceStreams
      - contentPackages
      - packageContents
      description: 서버에 저장된 본인 전체 학습 상태. 인증 token·권한·오프라인 학습권·기기 캐시·미전송 입력은 제외한다. 개인 기록은 전체이며, 콘텐츠 배열은 목적에 필요한 참조
        집합이다. offline/refresh에서는 선택 패키지·재개 세션의 본문만 준비하고 무관한 전체 catalogue/sense 본문을 강제하지 않는다. backup에서는 본인 서버 기록의
        모든 콘텐츠 참조를 보존한다. 다운로드 완료 상태는 담지 않는다.
    StateSnapshotCreate:
      type: object
      additionalProperties: false
      properties:
        purpose:
          type: string
          enum:
          - offline
          - refresh
        contentPackageIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          uniqueItems: true
      required:
      - purpose
      description: offline/refresh 상태의 콘텐츠 준비 범위. 서버 사용자 기록 자체는 주제별로 자르지 않는다. 소유권 검사 후 명시 패키지와 재개 세션 참조를 제공한다. backup
        목적은 이 API에서 생성하지 않는다.
    StateSnapshot:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        schemaVersion:
          type: integer
          const: 2
        purpose:
          type: string
          enum:
          - offline
          - refresh
          - backup
        stateRevision:
          type: integer
          minimum: 0
        capturedAt:
          type: string
          format: date-time
        receivedCursors:
          type: array
          items:
            $ref: '#/components/schemas/StreamCursor'
        summary:
          $ref: '#/components/schemas/BackupSummary'
        state:
          $ref: '#/components/schemas/SnapshotState'
      required:
      - id
      - schemaVersion
      - purpose
      - stateRevision
      - capturedAt
      - receivedCursors
      - summary
      - state
      description: 본문·집계·revision·cursor를 동일 DB snapshot에서 읽는다. backup purpose는 내부 작업 전용.
    BackupSummary:
      type: object
      additionalProperties: false
      properties:
        firstAttemptCount:
          type: integer
          minimum: 0
        savedSenseCount:
          type: integer
          minimum: 0
        sessionCount:
          type: integer
          minimum: 0
        unresolvedConflictCount:
          type: integer
          minimum: 0
        pendingEventCount:
          type: integer
          minimum: 0
        rejectedEventCount:
          type: integer
          minimum: 0
      required:
      - firstAttemptCount
      - savedSenseCount
      - sessionCount
      - unresolvedConflictCount
      - pendingEventCount
      - rejectedEventCount
    BackupArchive:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri-reference
        format:
          type: string
          enum:
          - json+gzip
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        byteSize:
          type: integer
          minimum: 1
      required:
      - url
      - format
      - sha256
      - byteSize
    BackupReference:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - building
          - ready
          - failed
          - expired
        capturedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        readyAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - id
      - status
      - capturedAt
      - readyAt
    Backup:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - building
          - ready
          - failed
          - expired
        scope:
          type: string
          enum:
          - all_server_learning_data
        triggerKind:
          type: string
          enum:
          - session_completed
          - manual
        requestedAt:
          type: string
          format: date-time
        capturedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        readyAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        schemaVersion:
          type: integer
          const: 2
        stateRevision:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        summary:
          anyOf:
          - $ref: '#/components/schemas/BackupSummary'
          - type: 'null'
        archive:
          anyOf:
          - $ref: '#/components/schemas/BackupArchive'
          - type: 'null'
        lastErrorCode:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
      required:
      - id
      - status
      - scope
      - triggerKind
      - requestedAt
      - capturedAt
      - readyAt
      - schemaVersion
      - stateRevision
      - summary
      - archive
      - lastErrorCode
      description: ready이면 파일·집계·기준 시각 필수. 완료 전에는 null일 수 있다.
      allOf:
      - if:
          properties:
            status:
              const: ready
        then:
          properties:
            capturedAt:
              type: string
              format: date-time
            readyAt:
              type: string
              format: date-time
            stateRevision:
              type: integer
              minimum: 0
            summary:
              $ref: '#/components/schemas/BackupSummary'
            archive:
              $ref: '#/components/schemas/BackupArchive'
      example:
        id: 00000000-0000-4000-8000-000000000010
        status: ready
        scope: all_server_learning_data
        triggerKind: session_completed
        requestedAt: '2026-10-05T00:39:58Z'
        capturedAt: '2026-10-05T00:40:00Z'
        readyAt: '2026-10-05T00:40:02Z'
        schemaVersion: 2
        stateRevision: 312
        summary:
          firstAttemptCount: 248
          savedSenseCount: 126
          sessionCount: 15
          unresolvedConflictCount: 0
          pendingEventCount: 0
          rejectedEventCount: 0
        archive:
          url: /api/v1/me/backups/00000000-0000-4000-8000-000000000010/archive
          format: json+gzip
          sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          byteSize: 184320
        lastErrorCode: null
    BackupCreate:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          enum:
          - manual
      required:
      - reason
    RestorationCreate:
      type: object
      additionalProperties: false
      properties:
        backupId:
          type: string
          format: uuid
        sourceStreamId:
          type: string
          format: uuid
        expectedDataGeneration:
          type: integer
          minimum: 1
        sourceReceivedThroughSequence:
          type: integer
          minimum: 0
        confirmation:
          type: string
          enum:
          - replace_current_device_learning_data
      required:
      - backupId
      - sourceStreamId
      - expectedDataGeneration
      - sourceReceivedThroughSequence
      - confirmation
      example:
        backupId: 00000000-0000-4000-8000-000000000010
        sourceStreamId: 00000000-0000-4000-8000-000000000003
        expectedDataGeneration: 1
        sourceReceivedThroughSequence: 84
        confirmation: replace_current_device_learning_data
    RestorationActivation:
      type: object
      additionalProperties: false
      properties:
        verifiedArchiveSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        catchUpSnapshotId:
          type: string
          format: uuid
        expectedDataGeneration:
          type: integer
          minimum: 1
        sourceReceivedThroughSequence:
          type: integer
          minimum: 0
      required:
      - verifiedArchiveSha256
      - catchUpSnapshotId
      - expectedDataGeneration
      - sourceReceivedThroughSequence
    RestorationCompletion:
      type: object
      additionalProperties: false
      properties:
        dataGeneration:
          type: integer
          minimum: 1
        streamId:
          type: string
          format: uuid
        installedSnapshotId:
          type: string
          format: uuid
      required:
      - dataGeneration
      - streamId
      - installedSnapshotId
    DeviceRestoration:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
        backup:
          $ref: '#/components/schemas/BackupReference'
        status:
          type: string
          enum:
          - preparing
          - activated
          - completed
          - cancelled
        scope:
          type: string
          enum:
          - current_device
        serverDataUnchanged:
          type: boolean
          const: true
        catchUpRequired:
          type: boolean
          const: true
        learningBlocked:
          type: boolean
        sourceGeneration:
          type: integer
          minimum: 1
        sourceStreamId:
          type: string
          format: uuid
        sourceReceivedThroughSequence:
          type: integer
          minimum: 0
        targetGeneration:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        targetStreamId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        catchUpSnapshotId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        lastErrorCode:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
        createdAt:
          type: string
          format: date-time
        activatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        cancelledAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - id
      - deviceId
      - backup
      - status
      - scope
      - serverDataUnchanged
      - catchUpRequired
      - learningBlocked
      - sourceGeneration
      - sourceStreamId
      - sourceReceivedThroughSequence
      - targetGeneration
      - targetStreamId
      - catchUpSnapshotId
      - lastErrorCode
      - createdAt
      - activatedAt
      - completedAt
      - cancelledAt
      description: 사용자 원본을 롤백하지 않는다. preparing/activated는 학습 차단. 완료·취소 후에만 해제.
      allOf:
      - if:
          properties:
            status:
              enum:
              - activated
              - completed
        then:
          properties:
            targetGeneration:
              type: integer
              minimum: 1
            targetStreamId:
              type: string
              format: uuid
            catchUpSnapshotId:
              type: string
              format: uuid
            activatedAt:
              type: string
              format: date-time
      - if:
          properties:
            status:
              enum:
              - preparing
              - activated
        then:
          properties:
            learningBlocked:
              const: true
      - if:
          properties:
            status:
              enum:
              - completed
              - cancelled
        then:
          properties:
            learningBlocked:
              const: false
      - if:
          properties:
            status:
              const: completed
        then:
          properties:
            completedAt:
              type: string
              format: date-time
      - if:
          properties:
            status:
              const: cancelled
        then:
          properties:
            cancelledAt:
              type: string
              format: date-time
    RestorationActionResult:
