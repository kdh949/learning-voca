      description: If-Match로 동시 수정 검사. label/active만 변경하며 ID·code·level은 유지한다. 새 catalogue snapshot·감사 로그와 함께 커밋.
        과거 게시본·패키지의 라벨 snapshot은 바꾸지 않는다.
      x-contract-status: proposed
      x-roles:
      - admin
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DifficultyLevel'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '412':
          $ref: '#/components/responses/412'
        '422':
          $ref: '#/components/responses/422'
        '428':
          $ref: '#/components/responses/428'
        '429':
          $ref: '#/components/responses/429'
      parameters:
      - name: level
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxonomyPatch'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-lv_session
      description: 서버 저장형 불투명 세션. 쿠키 이름은 제안. Secure/HttpOnly/Path=/, SameSite=Lax와 Origin·CSRF 검사를 함께 적용한다.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 읽은 자원의 강한 ETag. 예문·채점 수정은 부모 의미 초안 ETag를 사용한다.
      schema:
        type: string
        description: 강한 ETag. 따옴표까지 그대로 If-Match에 전송한다.
        example: '"7"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 사용자 범위 요청 식별자. 같은 key와 같은 본문은 이전 결과, 다른 본문은 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      description: 로그인 또는 GET /me가 발급한 세션 결합 token. Origin도 서버에서 검증한다.
      schema:
        type: string
        description: 불투명 값. 클라이언트에서 해석하거나 직접 생성하지 않는다.
        minLength: 1
  headers:
    ETag:
      description: 현재 자원의 강한 ETag. 자식 수정 응답에서는 부모 초안의 새 ETag.
      schema:
        type: string
        description: 강한 ETag. 따옴표까지 그대로 If-Match에 전송한다.
        example: '"7"'
    Location:
      description: 생성된 자원 또는 접수한 작업의 상대 URI.
      schema:
        type: string
        format: uri-reference
    RetryAfter:
      description: 재시도 전 대기할 초.
      schema:
        type: string
        pattern: ^[0-9]+$
    NoStore:
      description: 개인 백업·복원 응답을 공유 또는 Service Worker 캐시에 보관하지 않는다.
      schema:
        type: string
        const: private, no-store
    SetCookie:
      description: __Host-lv_session=<opaque>; Path=/; HttpOnly; Secure; SameSite=Lax. 로그아웃은 Max-Age=0. 이름·SameSite
        값은 제안이다.
      schema:
        type: string
  responses:
    '400':
      description: 요청 형식 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '401':
      description: 로그인 필요 또는 인증 실패
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '403':
      description: 권한·계정 상태·CSRF/Origin 검사 실패
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '404':
      description: 자원 없음 또는 타인 비공개 자원
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '409':
      description: 상태 충돌
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '410':
      description: 만료된 자원
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '412':
      description: ETag 불일치
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '413':
      description: 요청·파일 크기 초과
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '415':
      description: 지원하지 않는 콘텐츠 형식
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '422':
      description: 입력·참조·도메인 규칙 위반
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '428':
      description: If-Match 누락
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    '429':
      description: 호출 제한
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
    '503':
      description: 일시적 의존 서비스 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    FieldError:
      type: object
