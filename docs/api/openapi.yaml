x-design-decisions:
  confirmed:
  - 첫 버전 발음은 브라우저 TTS 전용, 음원 파일 업로드·다운로드 제외
  - 로컬 영어 음성 우선, 온라인에서는 브라우저가 제공하는 원격 영어 음성 허용
  - 오프라인은 로컬 음성만 사용, 발음 불가·실패가 텍스트 학습을 막지 않음
  - 정답 공개 후 목표 텍스트만 읽기, 별도 유료 TTS API·서버 endpoint 없음
  - 개인 학습 백업은 Cloudflare R2 Standard 비공개 전용 버킷과 인증 API 사용
  - 백업 삭제는 DB 상태·복원 참조로 판단, 날짜만으로 정상 파일을 삭제하는 lifecycle 없음
  - 여러 온라인 기기 학습
  - 오프라인 학습권 한 기기
  - 일정 충돌은 사용자 선택
  - 서버 전체 학습 데이터 백업
  - 사용자별 정상 백업 최대 3개, 복원 중인 파일 보호로 상한 초과하지 않음
  - 세션 출제는 예정 복습, 목표 확인 대기, 신규 순서
  - 재연습은 선택이며 피드백에서 다음 버튼으로 이동 허용
  - 복원은 현재 기기만, 최신 서버 상태 수신
  proposed:
  - cookie/header 이름과 CSRF token 발급 위치
  - 미정 세부 DTO 필드·enum·응답 wrapper
  - 목록 기본 20·상한 100, cursor 제한 20/100
  - 일자 필터 양끝 포함
  - 세션 active/completed·신고 처리 상태 enum
