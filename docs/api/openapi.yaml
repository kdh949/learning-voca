          uniqueItems: true
        difficultyMin:
          type: integer
          minimum: 1
        difficultyMax:
          type: integer
          minimum: 1
      required: []
      minProperties: 1
      description: 같은 배열은 OR, 기준 사이는 AND. 난이도는 예문 값에 양끝 포함 적용. 빈 배열·중복 ID 금지. min<=max와 등록/활성 사전 값은 서버에서 검사. source
        기본 catalog; 전체 범위는 source만 명시.
      allOf:
      - if:
          properties:
            source:
              const: saved
          required:
          - source
        then:
          not:
            anyOf:
            - required:
              - deckIds
            - required:
              - audienceIds
      example:
        source: catalog
        topicIds:
        - 00000000-0000-4000-8000-000000000701
        difficultyMin: 1
        difficultyMax: 1
