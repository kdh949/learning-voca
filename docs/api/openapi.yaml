      operationId: getPublishedSense
      summary: 게시 의미 상세
      tags:
      - Catalog
      description: 게시 의미 상세
      x-contract-status: proposed
      x-roles:
      - learner
      - editor
      - admin
      responses:
        '200':
          description: 성공 또는 같은 요청의 재전송 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sense'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      parameters:
      - name: senseId
        in: path
