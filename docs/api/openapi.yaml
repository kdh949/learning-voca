      - admin
      responses:
        '200':
          description: 성공 또는 같은 요청의 재전송 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensePage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          description: 불투명 값. 클라이언트에서 해석하거나 직접 생성하지 않는다.
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
  /catalog/senses/{senseId}:
