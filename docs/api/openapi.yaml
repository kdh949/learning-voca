          - approved
          - rejected
        contentHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        requestedBy:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
        reviewedBy:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        reviewedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        reviewNote:
          anyOf:
          - type: string
          - type: 'null'
        submittedSnapshot:
          oneOf:
          - $ref: '#/components/schemas/SenseRevision'
          - $ref: '#/components/schemas/DeckRevision'
      required:
      - id
      - target
      - status
      - contentHash
      - requestedBy
      - requestedAt
      - reviewedBy
      - reviewedAt
      - reviewNote
      - submittedSnapshot
      description: 반려 뒤 수정해도 제출 스냅샷은 바뀌지 않는다.
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
          - approve_and_publish
          - reject
