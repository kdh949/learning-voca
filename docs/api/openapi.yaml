openapi: 3.1.1
info:
  title: learning-voca API
  version: 0.2.0-draft
  description: '구현 전 설계 계약. HTTP 필드명·일부 enum·CSRF 전달 방식은 문서화 제안이며 운영 확정값이 아니다.
    확정 정책과 검토 항목은 ../planning/rest-api.md와 관련 설계 문서 참조. 2026-10-06: 주제·대상·예문 난이도 필터와 불변 선택 콘텐츠 패키지, 버전별 분류 연결을 추가했다. 구현 전 설계이며 전체 사용자 백업
    범위는 유지한다.'
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
- url: /api/v1
  description: 같은 origin의 상대 기본 경로. 운영 host/provider 미정.
tags:
- name: Auth
  description: 로그인·초대·비밀번호 재설정
- name: Me
  description: 본인 정보·설정
- name: Catalog
  description: 게시된 콘텐츠
- name: Learning
  description: 학습 세션·이력
- name: Sync
  description: 이벤트 수신·전체 상태 스냅샷
- name: Devices
  description: 기기·오프라인 학습권
- name: Conflicts
  description: 일정·개인 설정 충돌
- name: Backups
  description: 전체 백업·현재 기기 복원
- name: AdminAccounts
  description: 계정·초대
- name: AdminContent
  description: 의미·예문·채점·단어장
- name: AdminReview
  description: 검수·게시
- name: AdminOperations
  description: 신고·동기화 운영·감사
security:
- sessionCookie: []
paths:
  /auth/sessions:
    post:
      operationId: createAuthSession
      summary: 로그인과 현재 기기 연결
      tags:
      - Auth
      description: Origin 검사 후 불투명 세션 cookie를 설정한다. 기존 deviceId는 소유자 검증, 새 기기는 인증 성공 후 발급. CSRF token을 응답으로 전달하는
        방식은 제안이다.
      x-contract-status: proposed
      x-roles: []
      responses:
        '201':
          description: 자원 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/sessions/current:
    delete:
      operationId: deleteCurrentAuthSession
      summary: 현재 로그인 세션 종료
      tags:
      - Auth
      description: 현재 로그인 세션 종료
      x-contract-status: proposed
      x-roles:
      - learner
      - editor
      - admin
      responses:
        '204':
          description: 완료. 응답 본문 없음
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      parameters:
      - $ref: '#/components/parameters/Csrf'
  /me:
    get:
      operationId: getMe
      summary: 본인·설정·현재 기기 조회
      tags:
      - Me
      description: settings.etag를 설정 PATCH에 사용한다. activeRestorationId로 중단된 복원을 재개한다.
      x-contract-status: proposed
      x-roles:
      - learner
      - editor
      - admin
      responses:
        '200':
          description: 성공 또는 같은 요청의 재전송 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
  /me/settings:
    patch:
      operationId: patchSettings
      summary: 학습 설정 수정
      tags:
      - Me
      description: 온라인 전용. newWordLimit <= sessionLimit를 검사한다. 기기별 진동·입력 방식은 이 자원에 저장하지 않는다.
      x-contract-status: proposed
      x-roles:
      - learner
      - editor
      - admin
      responses:
        '200':
          description: 성공 또는 같은 요청의 재전송 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '412':
          $ref: '#/components/responses/412'
        '422':
          $ref: '#/components/responses/422'
        '428':
          $ref: '#/components/responses/428'
        '429':
          $ref: '#/components/responses/429'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
  /auth/invitation-inspections:
    post:
      operationId: inspectInvitation
      summary: 초대 token 확인
      tags:
      - Auth
      description: token을 URL query에 보내지 않는다. Origin을 검사하며 소비하지 않고 초대 상태만 조회한다.
      x-contract-status: proposed
      x-roles: []
      responses:
        '200':
          description: 성공 또는 같은 요청의 재전송 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationInspection'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '410':
          $ref: '#/components/responses/410'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationInspectionRequest'
  /auth/invitation-acceptances:
    post:
      operationId: acceptInvitation
      summary: 초대 수락과 계정 생성
      tags:
      - Auth
      description: 역할·이메일은 초대 기록에서 결정한다. 수락은 한 번만 가능하고 이후 별도로 로그인한다.
      x-contract-status: proposed
      x-roles: []
      responses:
        '201':
          description: 자원 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/400'
        '409':
          $ref: '#/components/responses/409'
        '410':
          $ref: '#/components/responses/410'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
  /auth/password-reset-requests:
    post:
      operationId: requestPasswordReset
      summary: 비밀번호 재설정 메일 요청
      tags:
      - Auth
      description: 존재 여부와 무관하게 동일한 202. token 30분 만료는 제안. Origin 검사와 호출 제한 적용.
      x-contract-status: proposed
      x-roles: []
      responses:
        '202':
          description: 비동기 작업 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/400'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
  /auth/password-resets:
    post:
      operationId: resetPassword
      summary: 비밀번호 재설정
      tags:
      - Auth
      description: 일회용 token을 소비하고 기존 인증 세션을 폐기한다. 이미 내려받은 오프라인 데이터를 원격 삭제하지 않는다.
      x-contract-status: proposed
      x-roles: []
      responses:
        '204':
          description: 완료. 응답 본문 없음
        '400':
          $ref: '#/components/responses/400'
        '410':
          $ref: '#/components/responses/410'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
  /catalog/decks:
    get:
      operationId: listPublishedDecks
      summary: 게시 단어장 목록
      tags:
      - Catalog
      description: 게시 단어장 목록 선택 패키지와 동일한 주제 교집합·대상·예문 난이도 predicate를 사용한다. 후보가 없는 단어장/의미는 목록에서 제외한다. ID 배열은 쉼표 구분.
        잘못된 범위·ID는 422.
      x-contract-status: proposed
      x-roles:
      - learner
      - editor
      - admin
      responses:
        '200':
          description: 성공 또는 같은 요청의 재전송 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeckPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '422':
          $ref: '#/components/responses/422'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: topicIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          uniqueItems: true
        style: form
        explode: false
      - name: audienceIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          uniqueItems: true
        style: form
        explode: false
      - name: difficultyMin
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: difficultyMax
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
  /catalog/decks/{deckId}:
    get:
      operationId: getPublishedDeck
      summary: 게시 단어장 상세
      tags:
      - Catalog
      description: 게시 단어장 상세
      x-contract-status: proposed
      x-roles:
      - learner
      - editor
      - admin
      responses:
        '200':
          description: 성공 또는 같은 요청의 재전송 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      parameters:
      - name: deckId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /catalog/decks/{deckId}/senses:
    get:
      operationId: listDeckSenses
      summary: 단어장의 게시 의미 목록
      tags:
      - Catalog
      description: 단어장의 게시 의미 목록 선택 패키지와 동일한 주제 교집합·대상·예문 난이도 predicate를 사용한다. 후보가 없는 단어장/의미는 목록에서 제외한다. ID 배열은
        쉼표 구분. 잘못된 범위·ID는 422.
      x-contract-status: proposed
      x-roles:
      - learner
      - editor
      - admin
      responses:
        '200':
          description: 성공 또는 같은 요청의 재전송 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensePage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '422':
          $ref: '#/components/responses/422'
      parameters:
      - name: deckId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          description: 불투명 값. 클라이언트에서 해석하거나 직접 생성하지 않는다.
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: topicIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          uniqueItems: true
        style: form
        explode: false
      - name: audienceIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          uniqueItems: true
        style: form
        explode: false
      - name: difficultyMin
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: difficultyMax
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
  /catalog/senses:
    get:
